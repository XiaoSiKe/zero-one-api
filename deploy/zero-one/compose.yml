name: zero-one-api

x-default-logging: &default-logging
  driver: json-file
  options:
    max-file: "5"
    max-size: 100m

services:
  edge:
    build:
      context: ../..
      dockerfile: deploy/zero-one/Dockerfile.edge
      args:
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.8.4-alpine}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        VITE_LOCAL_EDGE_PREVIEW: "false"
    image: ${EDGE_IMAGE:-zero-one-edge:local}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    extra_hosts:
      # Keep the Edge health probe inside its own network namespace while
      # preserving the canonical TLS SNI and HTTP Host name.
      - api.01yapi.com:127.0.0.1
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./state/caddy-data:/data
      - ./state/caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "--no-check-certificate", "-O", "/dev/null", "https://api.01yapi.com/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - gateway

  sub2api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${SUB2API_IMAGE:-zero-one-sub2api:local}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.tcp_congestion_control: bbr
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - ./state/sub2api:/app/data
    # Stable container-side name for host-local upstream tunnels. Provider
    # Accounts should use http://superapi-direct:<port>, never a Docker bridge
    # address such as 172.x.x.x which can change after a network recreate.
    extra_hosts:
      superapi-direct: host-gateway
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      RUN_MODE: standard
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 0
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - gateway
      - data

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./state/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./state/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command: >-
      sh -c 'exec redis-server --save 60 1 --appendonly yes
      --appendfsync everysec --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - data

networks:
  gateway:
    driver: bridge
  data:
    driver: bridge
    internal: true
