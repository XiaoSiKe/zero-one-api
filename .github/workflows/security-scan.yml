name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Select affected verification
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            node .github/scripts/select-test-impact.mjs --all >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/select-test-impact.mjs \
              --base "$BASE_SHA" --head "$HEAD_SHA" --mode "$EVENT_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Impact decision - backend security not applicable
        if: steps.impact.outputs.backend_security != 'true'
        run: echo 'Go dependencies and security policy are unchanged.'
      - name: Set up Go
        if: steps.impact.outputs.backend_security == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        if: steps.impact.outputs.backend_security == 'true'
        run: |
          go version | grep -q 'go1.27.0'
      - name: Run govulncheck
        if: steps.impact.outputs.backend_security == 'true'
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Impact decision - backend security required
        if: steps.impact.outputs.backend_security == 'true'
        run: echo 'Affected Backend dependency audit completed.'

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Select affected verification
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            node .github/scripts/select-test-impact.mjs --all >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/select-test-impact.mjs \
              --base "$BASE_SHA" --head "$HEAD_SHA" --mode "$EVENT_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Impact decision - frontend security not applicable
        if: steps.impact.outputs.frontend_security != 'true'
        run: echo 'Frontend dependencies and audit exceptions are unchanged.'
      - name: Set up pnpm
        if: steps.impact.outputs.frontend_security == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        if: steps.impact.outputs.frontend_security == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.impact.outputs.frontend_security == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        if: steps.impact.outputs.frontend_security == 'true'
        working-directory: frontend
        run: |
          pnpm audit --json > audit.json || true
      - name: Check audit exceptions
        if: steps.impact.outputs.frontend_security == 'true'
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
      - name: Impact decision - frontend security required
        if: steps.impact.outputs.frontend_security == 'true'
        run: echo 'Affected Frontend dependency audit completed.'
